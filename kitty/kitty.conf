# Tokyo Night Storm
background #24283b
foreground #c0caf5
selection_background #2e3c64
selection_foreground #c0caf5
url_color #73daca
cursor #c0caf5
cursor_text_color #24283b

# Tabs
active_tab_background #7aa2f7
active_tab_foreground #1f2335
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
tab_bar_background #1d202f

# Windows
active_border_color #7aa2f7
inactive_border_color #292e42

# normal
color0 #1d202f
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# bright
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# extended colors
color16 #ff9e64
color17 #db4b4b

# font
font_size 14.0
font_family RobotoMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
scrollback_lines 10000
modify_font cell_height -1px

# generic
shell zsh
editor /opt/homebrew/bin/nvim
confirm_os_window_close 0
enable_audio_bell no

# Performance
repaint_delay    4
sync_to_monitor  yes

# style kitty window
hide_window_decorations titlebar-only
window_padding_width 2 5 5 5

# disable all shortcuts and keep necessary
clear_all_shortcuts yes
map --allow-fallback=shifted,ascii cmd+c copy_or_noop
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard
map cmd+q quit
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0
